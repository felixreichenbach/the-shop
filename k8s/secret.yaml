# Demo credentials only, matching docker-compose.yml — replace before any real deployment.
apiVersion: v1
kind: Secret
metadata:
  name: the-shop-secrets
type: Opaque
stringData:
  POSTGRES_USER: the-shop
  POSTGRES_PASSWORD: the-shop
  POSTGRES_DB: the-shop
  DATABASE_URL: postgresql://the-shop:the-shop@db:5432/the-shop
  SESSION_SECRET: change-me-in-production
