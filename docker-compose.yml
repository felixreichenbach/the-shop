services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: the-shop
      POSTGRES_PASSWORD: the-shop
      POSTGRES_DB: the-shop
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U the-shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://the-shop:the-shop@db:5432/the-shop
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
